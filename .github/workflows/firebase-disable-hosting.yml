# Ejecutar a mano UNA vez, cuando patriciomariano.com ya esté sirviendo desde Cloudflare Pages.
# Apaga Firebase Hosting (incluido patricio-mariano.web.app y .firebaseapp.com),
# así los bots no pueden seguir consumiendo la cuota por esas direcciones.
name: Desactivar Firebase Hosting
on:
  workflow_dispatch:
    inputs:
      confirmar:
        description: 'Escribí APAGAR para confirmar'
        required: true
jobs:
  disable:
    if: ${{ github.event.inputs.confirmar == 'APAGAR' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install -g firebase-tools
      - name: Apagar hosting
        run: firebase hosting:disable --project patricio-mariano --force
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
